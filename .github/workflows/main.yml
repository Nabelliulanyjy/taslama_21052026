name: Connect and Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Kody cekip almak (Checkout)
        uses: actions/checkout@v4

      - name: SSHpass gurnamak
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: VPS serwere birikmek we komandalary isletmek
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -p 22 \
            root@45.61.158.122 \
            "whoami && hostname && uptime"
