name: Google Ping Barlagy

# Workflow haçan işlemeli?
on:
  push:
    branches: [ "main" ]  # main şahasyna kod push edilende işe düşer
  pull_request:
    branches: [ "main" ]  # main şahasyna pull request açylanda işe düşer
  workflow_dispatch:      # GitHub paneli arkaly el bilen (manual) işletmek mümkinçiligi

jobs:
  ping_testi:
    runs-on: ubuntu-latest  # Iş Ubuntu wirtual serwerinde ýerine ýetiriler

    steps:
      # 1. Ädim: Repozitoridäki kody wirtual serwere göçürmek
      - name: Kody alyp gelmek
        uses: actions/checkout@v4

      # 2. Ädim: Google.com-a ping ibermek
      - name: Google.com sahypasyna ping iber
        run: |
          echo "Google serwerlerine ping iberilip başlanýar..."
          # -c 4 komandasy jemi 4 gezek ping paketini iberer
          ping -c 4 google.com

      # 3. Ädim: Barlag tamamlandy habary
      - name: Netije
        run: echo "Ping barlagy üstünlikli tamamlandy!"
